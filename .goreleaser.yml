version: 2
project_name: qsh

before:
  hooks:
    - go mod tidy

builds:
  - id: qsh
    main: ./cmd/qsh
    binary: qsh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64  # drop if you want Windows ARM64 too

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

nfpms:
  - id: packages
    package_name: qsh
    vendor: Allen Bijo
    homepage: https://github.com/allenbijo/QuickSSH-terminal
    maintainer: Allen Bijo <gmail@allenbijo.com>
    description: |
      Terminal UI for managing SSH port-forward tunnels.
      Shares its config with the QuickSSH Electron app.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: net
    priority: optional
    contents:
      - src: LICENSE
        dst: /usr/share/doc/qsh/LICENSE
      - src: README.md
        dst: /usr/share/doc/qsh/README.md
    overrides:
      deb:
        dependencies:
          - openssh-client
      rpm:
        dependencies:
          - openssh-clients
      apk:
        dependencies:
          - openssh-client

aurs:
  - name: qsh-bin
    homepage: https://github.com/allenbijo/QuickSSH-terminal
    description: "Terminal UI for SSH port-forward tunnels (shares config with the QuickSSH Electron app)."
    maintainers:
      - 'Allen Bijo <gmail@allenbijo.com>'
    license: MIT
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/qsh-bin.git'
    skip_upload: false
    depends:
      - openssh
    package: |-
      install -Dm755 "./qsh" "${pkgdir}/usr/bin/qsh"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/qsh-bin/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/qsh-bin/README.md"

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

brews:
  - name: qsh
    repository:
      owner: allenbijo
      name: homebrew-tap
      token: "{{ .Env.TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/allenbijo/QuickSSH-terminal
    description: "Terminal UI for managing SSH port-forward tunnels (shares config with the QuickSSH Electron app)."
    license: MIT
    test: |
      system "#{bin}/qsh", "--version"
    install: |
      bin.install "qsh"

winget:
  - name: qsh
    publisher: allenbijo
    package_identifier: allenbijo.qsh
    license: MIT
    short_description: "Terminal UI for SSH port-forward tunnels (shares config with the QuickSSH Electron app)."
    homepage: https://github.com/allenbijo/QuickSSH-terminal
    publisher_url: https://github.com/allenbijo
    publisher_support_url: https://github.com/allenbijo/QuickSSH-terminal/issues
    release_notes_url: "https://github.com/allenbijo/QuickSSH-terminal/releases/tag/v{{ .Version }}"
    repository:
      owner: allenbijo
      name: winget-pkgs
      branch: "qsh-{{ .Version }}"
      token: "{{ .Env.TAP_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  github:
    owner: allenbijo
    name: QuickSSH-terminal
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1
